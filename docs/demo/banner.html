<!DOCTYPE html>
<!--
  Source for docs/screenshots/banner.png (README header and GitHub social
  preview, 1280x640). Re-render with: node docs/demo/render.js
  The graph art is docs/demo/banner-graph.svg (python3 docs/demo/graph_svg.py).
  Try another tagline without editing: banner.html?t=Headline&s=Subline
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative;
    background: radial-gradient(ellipse 70% 90% at 82% 50%, #161d2b 0%, #0d1117 70%);
    color: #e6edf3; font-family: Inter, -apple-system, "Segoe UI", sans-serif;
  }
  .graph { position: absolute; right: 50px; top: 50px; width: 540px; height: 540px; }
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .name { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; color: #9aa4b0; margin-bottom: 26px; }
  .name .mark { font-size: 30px; }
  h1 { font-family: "Inter Display", Inter, sans-serif; font-size: 66px; line-height: 1.04; font-weight: 750; letter-spacing: -0.035em; margin-bottom: 22px; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #4f8ef7, #4ade80); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 22px; line-height: 1.5; color: #9aa4b0; max-width: 560px; margin-bottom: 30px; }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }
  .pills span { font-size: 15px; font-weight: 500; color: #c9d1d9; border: 1px solid #30363d; background: #161b22; padding: 7px 14px; border-radius: 999px; }
  .handle { position: absolute; left: 80px; bottom: 44px; font-size: 17px; color: #6e7781; display: flex; gap: 22px; }
  .handle b { color: #c9d1d9; font-weight: 600; }
</style>
</head>
<body>
  <img class="graph" src="banner-graph.svg" alt="">
  <div class="copy">
    <div class="name"><span class="mark">🧠</span>Second Brain AI</div>
    <h1 id="t">Everything you read, <em>connected.</em></h1>
    <p class="sub" id="s">Save an article, video or PDF. AI turns it into linked notes in your Obsidian vault.</p>
    <div class="pills"><span>Open source</span><span>Obsidian</span><span>Free local mode</span><span>Runs 24/7 on a VPS</span></div>
  </div>
  <div class="handle"><span><b>@NiteshTechAI</b></span><span>github.com/nitesht2/second-brain-ai</span></div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get("t")) document.getElementById("t").innerHTML = q.get("t");
    if (q.get("s")) document.getElementById("s").textContent = q.get("s");
  </script>
</body>
</html>
